version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orcasagent-gtm
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Optional: nginx reverse proxy for production-like local testing
  # Uncomment and configure if you need SSL termination or routing
  #
  # nginx:
  #   image: nginx:alpine
  #   container_name: orcasagent-nginx
  #   ports:
  #     - "80:80"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
  #   depends_on:
  #     app:
  #       condition: service_healthy
  #   restart: unless-stopped

networks:
  default:
    name: orcasagent-gtm-network